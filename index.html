<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>9:20 Sector Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 9:20 Scanner. A calm trading desk: quiet surfaces, numbers in mono, green/red only for market direction, amber marks the app's own state (scan time, lock, selection). */
:root{
  --r-lg:14px; --r:10px; --r-sm:7px;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
/* Themes. Each picks one base hue for the neutrals and one accent from colour theory; green/red stay reserved for market direction
   and are tuned per background for contrast. --heat-* are "r,g,b" for the heatmap ramp (read by the script). */
/* Slate (default): cool blue-grey neutrals (hue ~215) + warm amber accent = complementary pair. Lifted from near-black for comfort. */
:root,[data-theme=slate]{
  --bg:#1a212c; --surface:#222a37; --surface2:#29323f; --surface3:#323c4b; --hover:#2c3543;
  --line:#323c4b; --line2:#425062;
  --text:#eef2f7; --text2:#c6cfdb; --muted:#929eb0;
  --accent:#f5b84a; --accent-soft:rgba(245,184,74,.15); --accent-ink:#241a04;
  --up:#1fe08a; --up-soft:rgba(31,224,138,.16); --down:#ff4d5e; --down-soft:rgba(255,77,94,.16);
  --heat-n:52,62,77; --heat-up:0,200,105; --heat-down:240,44,62;
  --pick-ring:rgba(255,255,255,.95); --glow:rgba(245,184,74,.06); --shadow:0 6px 20px rgba(0,0,0,.18); --nav:rgba(34,42,55,.94);
  color-scheme:dark;
}
/* Daylight: light, cool neutrals (hue ~215) + indigo accent. Indigo sits between the green and red hues, so it never reads as a market signal. */
[data-theme=daylight]{
  --bg:#f2f5f9; --surface:#ffffff; --surface2:#f3f6fa; --surface3:#e7ecf2; --hover:#eef2f7;
  --line:#e2e8f0; --line2:#cdd6e1;
  --text:#152030; --text2:#3a475a; --muted:#68758a;
  --accent:#4f5bd5; --accent-soft:rgba(79,91,213,.11); --accent-ink:#ffffff;
  --up:#00a650; --up-soft:rgba(0,166,80,.12); --down:#e5162e; --down-soft:rgba(229,22,46,.10);
  --heat-n:228,233,240; --heat-up:0,184,86; --heat-down:236,32,56;
  --pick-ring:#152030; --glow:rgba(79,91,213,.05); --shadow:0 4px 14px rgba(21,32,48,.07); --nav:rgba(255,255,255,.94);
  color-scheme:light;
}
/* Sand: warm paper neutrals (hue ~40) + teal accent, its complement. Lower glare for long sessions. */
[data-theme=sand]{
  --bg:#f5efe4; --surface:#fffcf6; --surface2:#f6efe3; --surface3:#ece3d4; --hover:#f2eadc;
  --line:#e8ddcb; --line2:#d6c7b0;
  --text:#2b2419; --text2:#4f4636; --muted:#857a66;
  --accent:#0e8585; --accent-soft:rgba(14,133,133,.11); --accent-ink:#ffffff;
  --up:#0f9a4a; --up-soft:rgba(15,154,74,.13); --down:#d92b2b; --down-soft:rgba(217,43,43,.11);
  --heat-n:236,228,214; --heat-up:10,170,80; --heat-down:226,40,40;
  --pick-ring:#2b2419; --glow:rgba(14,133,133,.04); --shadow:0 4px 14px rgba(70,50,20,.07); --nav:rgba(255,252,246,.94);
  color-scheme:light;
}
/* Ocean: analogous blues (hue ~210) + aqua accent from the same family; a medium-dark theme with more colour than Slate. */
[data-theme=ocean]{
  --bg:#152a42; --surface:#1c3451; --surface2:#233d5c; --surface3:#2c4869; --hover:#26425f;
  --line:#2d4867; --line2:#3d5b7d;
  --text:#ecf4fc; --text2:#c0d3e6; --muted:#8fa8c2;
  --accent:#5ad6c8; --accent-soft:rgba(90,214,200,.15); --accent-ink:#06231f;
  --up:#2bf09a; --up-soft:rgba(43,240,154,.16); --down:#ff5a6e; --down-soft:rgba(255,90,110,.16);
  --heat-n:42,68,98; --heat-up:0,206,120; --heat-down:246,52,78;
  --pick-ring:rgba(255,255,255,.95); --glow:rgba(90,214,200,.07); --shadow:0 6px 20px rgba(0,10,25,.2); --nav:rgba(28,52,81,.94);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1200px 500px at 50% -200px,var(--glow),transparent 70%),var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)}
.spacer{flex:1}
.hint{font-size:12px;color:var(--muted)}

/* ---------- shell ---------- */
#app{height:100%;display:flex;flex-direction:column;max-width:1240px;margin:0 auto}
header{order:0;display:flex;align-items:center;gap:14px;padding:12px 20px;flex-wrap:wrap;row-gap:10px}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.logo{display:grid;place-items:center;height:32px;padding:0 8px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font:700 13px/1 var(--mono);letter-spacing:-.02em}
.bt{display:flex;flex-direction:column;line-height:1.15}
.bt b{font-weight:600;font-size:14px;letter-spacing:-.01em}
.tag{align-self:flex-start;margin-top:3px;font:600 9.5px/1 var(--mono);letter-spacing:.08em;padding:3px 6px 3px 6px;border-radius:999px;background:var(--surface3);color:var(--muted)}
.tag.live{background:var(--up-soft);color:var(--up)}
.tag.live::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--up);margin-right:5px;vertical-align:1px;box-shadow:0 0 0 0 rgba(46,197,141,.6)}
@media (prefers-reduced-motion:no-preference){.tag.live::before{animation:pulse 2s infinite}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,197,141,.55)}70%{box-shadow:0 0 0 6px rgba(46,197,141,0)}100%{box-shadow:0 0 0 0 rgba(46,197,141,0)}}
.hgroup{display:flex;align-items:center;gap:8px}
.dgroup{display:flex;align-items:center;gap:6px}
.datepick{display:flex;align-items:center;gap:7px;height:34px;padding:0 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);color:var(--muted);cursor:pointer}
.datepick:focus-within{border-color:var(--accent)}
.datepick input{background:none;border:0;outline:none;color:var(--text);font:500 12.5px var(--mono);color-scheme:inherit;cursor:pointer}
.datepick.past{border-color:var(--accent);background:var(--accent-soft)}
.datepick.past svg{color:var(--accent)}
#latestBtn[hidden],.dgroup[hidden]{display:none}
.hlabel{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.clockbox{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.clock{font:600 20px/1 var(--mono);letter-spacing:-.02em}
.clockbox .sub{font-size:10.5px;color:var(--muted);margin-top:3px;letter-spacing:.04em}
.pill{display:inline-flex;align-items:center;gap:6px;font:500 12px/1 var(--sans);padding:8px 11px;border-radius:999px;white-space:nowrap}
.pill svg.i{width:14px;height:14px}
.pill.wait{color:var(--accent);background:var(--accent-soft)}
.pill.lock{color:var(--text);background:var(--surface3)}
.pill.lock svg{color:var(--accent)}

nav.tabs{order:3;display:flex;background:var(--nav);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;background:none;border:0;border-radius:10px;color:var(--muted);font-size:11.5px;font-weight:500;position:relative}
nav.tabs button svg.i{width:20px;height:20px}
nav.tabs button:hover{color:var(--text2)}
nav.tabs button[aria-selected=true]{color:var(--text)}
nav.tabs button[aria-selected=true] svg{color:var(--accent)}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:700 10.5px/1 var(--mono)}
.badge[hidden]{display:none}
nav.tabs .badge{position:absolute;top:3px;left:calc(50% + 6px)}

.transport{order:1;display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 20px 6px;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.transport input[type=range]{flex:1;min-width:140px;accent-color:var(--accent)}
main{order:2;flex:1;overflow-y:auto;padding:14px 20px 28px;scrollbar-color:var(--line2) transparent}

@media (min-width:900px){
  nav.tabs{order:1;border-top:0;border-bottom:1px solid var(--line);background:transparent;backdrop-filter:none;padding:0 14px;gap:4px}
  nav.tabs button{flex:0 0 auto;flex-direction:row;gap:8px;padding:11px 14px 12px;font-size:13.5px;border-radius:0;border-bottom:2px solid transparent;margin-bottom:-1px}
  nav.tabs button svg.i{width:17px;height:17px}
  nav.tabs button[aria-selected=true]{border-bottom-color:var(--accent)}
  nav.tabs .badge{position:static}
  .transport{order:2;margin:12px 20px 0}
  main{order:3;padding:18px 20px 32px}
}
@media (max-width:640px){
  header{padding:10px 14px;gap:10px}
  .hlabel{display:none}
  .dgroup{order:4}
  .hgroup{order:5;flex:1 1 55%}
  .pill{order:6}
  .hgroup .seg{flex:1}.hgroup .seg button{flex:1}
  main{padding:12px 14px 24px}
  .transport{margin:0 14px 6px}
}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--line2);border-radius:var(--r-sm);padding:8px 13px;font-size:13px;font-weight:500;transition:background .15s,border-color .15s}
.btn:hover{background:var(--hover);border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.sm{padding:5px 10px;font-size:12px}
select.btn{padding-right:8px}
.iconbtn{display:grid;place-items:center;width:36px;height:36px;border-radius:var(--r-sm);background:var(--surface2);border:1px solid var(--line2)}
.iconbtn:hover{background:var(--hover)}
.seg{display:inline-flex;padding:3px;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.seg button{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:none;border:0;border-radius:7px;padding:6px 12px;font-size:12.5px;font-weight:500;color:var(--muted);white-space:nowrap;transition:background .15s,color .15s}
.seg button:hover:not(:disabled){color:var(--text2)}
.seg button[aria-pressed=true]{background:var(--surface3);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.seg button:disabled{opacity:.4}
.seg.lg button{padding:8px 16px;font-size:13.5px}
.seg button.buy[aria-pressed=true]{color:var(--up)} .seg button.sell[aria-pressed=true]{color:var(--down)}
.cnt{font:600 11px/1 var(--mono);padding:3px 6px;border-radius:999px;background:var(--surface2);color:var(--text2)}
.seg button.buy[aria-pressed=true] .cnt{background:var(--up-soft);color:var(--up)}
.seg button.sell[aria-pressed=true] .cnt{background:var(--down-soft);color:var(--down)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;border:1px solid transparent;background:var(--surface2);font-size:12px;font-weight:500;color:var(--text2);white-space:nowrap}
.chip.ok{background:var(--up-soft);color:var(--up)} .chip.bad{background:var(--down-soft);color:var(--down)} .chip.no{color:var(--muted);background:transparent;border-color:var(--line2)}
button.chip{cursor:pointer;transition:filter .15s} button.chip:hover{filter:brightness(1.2)}
.ctag{font:600 9px/1 var(--sans);text-transform:uppercase;letter-spacing:.07em;padding:3px 5px;border-radius:4px;background:var(--surface3);color:var(--muted);vertical-align:2px}
.pl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:500;margin-right:2px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.card-surface,.pickbar,.summary,.seclist,.qhead,.chartwrap,.sgroup,.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}

/* ---------- heatmap ---------- */
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.crumb{background:none;border:0;padding:4px 2px;font-size:15px;font-weight:600;color:var(--muted)}
button.crumb:hover{color:var(--text)}
.crumb.on{color:var(--text)}
.crumbs .sep{color:var(--line2);font-size:15px}
.legend{margin-left:auto;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.legend .bar{width:140px;height:6px;border-radius:3px;background:linear-gradient(90deg,rgb(var(--heat-down)),rgb(var(--heat-n)) 50%,rgb(var(--heat-up)))}
.heatgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.heatgrid.stocks{grid-template-columns:repeat(auto-fill,minmax(128px,1fr))}
.heatgrid>.empty{grid-column:1/-1}
.tile{position:relative;min-height:88px;border-radius:10px;padding:10px 11px;overflow:hidden;cursor:pointer;border:0;text-align:left;color:#fff;display:flex;flex-direction:column;gap:4px;line-height:1.15;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.tile.ink-dark{text-shadow:none}
.tile:hover{filter:brightness(1.1)}
.tile .t0{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;min-width:0}
.tile .t1{font-weight:600;font-size:12.5px;letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .t2{font:700 19px/1.1 var(--mono);letter-spacing:-.02em;margin-top:auto}
.tile .t3{font:500 11px/1 var(--mono);opacity:.8}
.tile .rk{font:600 10px/1 var(--mono);opacity:.55;padding-top:2px}
.tile .bdg{flex:none;font:700 9.5px/1 var(--mono);letter-spacing:.04em;padding:4px 6px;border-radius:5px;background:rgba(10,14,20,.6);color:#fff;white-space:nowrap;text-shadow:none}
.tile.ink-dark .bdg{background:rgba(255,255,255,.75);color:#152030}
.tile.pickB,.tile.pickS{box-shadow:inset 0 0 0 2px var(--pick-ring)}
@media (max-width:640px){.heatgrid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:5px}.heatgrid.stocks{grid-template-columns:repeat(auto-fill,minmax(98px,1fr))}.tile{min-height:76px;padding:8px 9px}.tile .t2{font-size:16px}.tile .t1{font-size:11.5px}}
.pickbar{margin-top:12px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.pg{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.pickbar .hint{flex-basis:100%;margin:0}
.seclist{margin-top:14px;overflow:hidden}
.seclist .hd{display:flex;justify-content:space-between;align-items:baseline;padding:13px 16px 10px}
.seclist .hd b{font-size:14px;font-weight:600}
.secgrid{display:grid;grid-template-columns:28px minmax(150px,1.6fr) 96px 78px 64px 64px minmax(140px,1.2fr);gap:12px;align-items:center}
.sechead{padding:8px 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:500}
.secrow{width:100%;padding:10px 16px;background:none;border:0;border-bottom:1px solid var(--line);color:inherit;font:inherit;text-align:left;cursor:pointer;transition:background .12s}
.secrow:last-child{border-bottom:0}.secrow:hover{background:var(--hover)}
.secrow .nm{font-weight:500;display:flex;align-items:center;gap:6px;min-width:0}
.secrow .nm span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.secrow .r{text-align:right}
.secrow .chg{display:flex;align-items:center;gap:10px}
.secrow .chg b{min-width:58px;text-align:right;font-weight:600}
.dbar{position:relative;flex:1;height:6px;border-radius:3px;background:var(--surface3)}
.dbar::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line2)}
.dbar i{position:absolute;top:0;bottom:0;border-radius:3px}
.dbar i.pos{left:50%;background:var(--up)} .dbar i.neg{right:50%;background:var(--down)}
.ad{font-size:12px;white-space:nowrap}
@media (max-width:760px){
  .secgrid{grid-template-columns:22px 1fr 58px minmax(96px,.9fr);gap:8px}
  .secgrid .c-val,.secgrid .c-ad,.secgrid .c-n{display:none}
  .secrow{padding:10px 12px}.sechead{padding:8px 12px}
  .dbar{display:none}
  .legend .bar{width:80px}
}

/* ---------- shortlist ---------- */
.summary{padding:14px 16px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center}
.summary .st{display:flex;gap:12px;align-items:center;flex:1 1 320px;min-width:0}
.sti{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--surface3);color:var(--muted);flex:none}
.summary.locked .sti{background:var(--accent-soft);color:var(--accent)}
.summary.live .sti{background:var(--up-soft);color:var(--up)}
.summary b{font-weight:600;font-size:14.5px}
.summary p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.summary .sp{display:flex;flex-direction:column;gap:8px}
.sidebar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{padding:0;display:flex;flex-direction:column;cursor:pointer;text-align:left;width:100%;overflow:hidden;transition:border-color .15s,transform .15s,background .15s;box-shadow:var(--shadow)}
.pickbar,.summary,.seclist,.qhead,.chartwrap,.sgroup{box-shadow:var(--shadow)}
.card:hover{border-color:var(--line2);background:var(--hover)}
@media (prefers-reduced-motion:no-preference){.card:hover{transform:translateY(-1px)}}
.card>span{display:flex}
.card .ch{justify-content:space-between;align-items:flex-start;gap:8px;padding:14px 16px 10px;border-left:3px solid transparent}
.card.buy .ch{border-left-color:var(--up)} .card.sell .ch{border-left-color:var(--down)}
.card .sym{display:block;font-weight:700;font-size:16px;letter-spacing:-.01em}
.card .sec{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.card .px{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.card .ltp{font:600 16px/1 var(--mono)}
.chg{font:600 11.5px/1 var(--mono);padding:4px 7px;border-radius:6px}
.chg.up{background:var(--up-soft)} .chg.down{background:var(--down-soft)} .chg.muted{background:var(--surface3)}
.card .cb{gap:14px;padding:4px 16px 14px;align-items:center}
.card .pdc{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 8px;border-radius:9px;background:var(--surface2);flex:none}
.card .pdc small{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.checks{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.ck{display:flex;align-items:flex-start;line-height:18px;gap:8px;font-size:12.5px;min-width:0}
.ck i{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;flex:none}
.ck i svg.i{width:11px;height:11px;stroke-width:2.6}
.ck.ok i{background:var(--up-soft);color:var(--up)} .ck.bad i{background:var(--down-soft);color:var(--down)}
.ck em{font-style:normal;color:var(--muted);width:74px;flex:none}
.ck>span{color:var(--text2);min-width:0;overflow-wrap:anywhere}
.ck.bad>span{color:var(--down)}
.card .cf{justify-content:space-between;gap:8px;flex-wrap:wrap;padding:9px 16px;border-top:1px solid var(--line);background:var(--surface2);font-size:11.5px;color:var(--muted)}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:36px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:var(--r-lg)}
.empty svg.i{width:26px;height:26px;color:var(--line2);margin-bottom:4px}
.empty b{color:var(--text2);font-weight:500}
.empty .err{color:var(--down);font-weight:600}
.empty p{margin:0;max-width:520px;font-size:12.5px}
details.near{margin-top:18px}
details.near>summary{list-style:none;display:flex;align-items:center;gap:10px;cursor:pointer;padding:10px 0;color:var(--text2);font-weight:500}
details.near>summary::-webkit-details-marker{display:none}
details.near>summary svg.i{transition:transform .2s;color:var(--muted)}
details.near[open]>summary svg.i{transform:rotate(90deg)}
details.near>summary .badge{background:var(--surface3);color:var(--text2)}
details.near .cards{opacity:.92}
.spin{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--accent);margin-bottom:6px}
@media (prefers-reduced-motion:no-preference){.spin{animation:spin .9s linear infinite}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- chart ---------- */
.ctool{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.search{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;background:var(--surface);border:1px solid var(--line2);border-radius:var(--r-sm);color:var(--muted)}
.search:focus-within{border-color:var(--accent)}
.search input{background:none;border:0;outline:none;width:150px;font-family:var(--mono);font-weight:500;text-transform:uppercase;color:var(--text)}
.quick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px}
.quick:empty{display:none}
.quick .pl:not(:first-child){margin-left:8px}
.qhead{padding:14px 16px;margin-bottom:12px}
.qt{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.qsym{font-size:22px;font-weight:700;letter-spacing:-.02em}
.qt .sec{font-size:12px;color:var(--muted)}
.qt .chip{margin-left:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.stat{background:var(--surface2);border-radius:9px;padding:9px 11px;display:flex;flex-direction:column;gap:3px}
.stat>span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.stat b{font:600 14px/1.2 var(--mono)}
.stat em{font:600 11.5px/1 var(--mono);font-style:normal}
.chartwrap{padding:12px 14px 10px;margin-bottom:12px}
.chartwrap .hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px;font-size:13px}
.chartwrap .hd b{font-weight:600}
canvas{width:100%;height:300px;display:block;touch-action:pan-y}
canvas.short{height:220px}
.readout{min-height:18px;font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:6px}

/* ---------- settings ---------- */
.settings{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));align-items:start}
.sgroup{padding:16px}
.sgroup header{all:unset;display:block;margin-bottom:14px}
.eyebrow{display:block;font-size:10.5px;color:var(--accent);text-transform:uppercase;letter-spacing:.09em;font-weight:600;margin-bottom:3px}
.sgroup h3{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.sfields{display:grid;gap:14px}
.field{display:grid;gap:6px;transition:opacity .2s}
.field.dim{opacity:.45}
.field label{font-weight:500;font-size:13px}
.field small{color:var(--muted);font-size:12px;line-height:1.45}
.field input[type=number],.field input[type=text],.field input[type=time],.field select{background:var(--bg);border:1px solid var(--line2);border-radius:var(--r-sm);padding:9px 11px;width:100%;transition:border-color .15s}
.field input:focus,.field select:focus{border-color:var(--accent);outline:none}
.switch{display:flex;align-items:flex-start;gap:12px;cursor:pointer;font-size:13px;font-weight:500}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.track{position:relative;flex:none;width:36px;height:20px;border-radius:999px;background:var(--surface3);border:1px solid var(--line2);transition:background .2s}
.track::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.switch input:checked+.track{background:var(--accent-soft);border-color:var(--accent)}
.switch input:checked+.track::after{transform:translateX(16px);background:var(--accent)}
.switch input:focus-visible+.track{outline:2px solid var(--accent);outline-offset:2px}
.switch .lbl small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.themes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.swatch{position:relative;display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:var(--r);border:1px solid var(--line2);background:var(--surface2);cursor:pointer;transition:border-color .15s}
.swatch:hover{border-color:var(--muted)}
.swatch input{position:absolute;opacity:0;width:1px;height:1px}
.swatch:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.swatch:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.sw{display:flex;height:34px;border-radius:7px;overflow:hidden;border:1px solid rgba(0,0,0,.12)}
.sw i{flex:1}.sw i:first-child{flex:2}
.swatch b{font-size:13px;font-weight:600}
.swatch small{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.sactions{grid-column:1/-1;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
details.dev{grid-column:1/-1;color:var(--muted);font-size:12px}
details.dev summary{cursor:pointer;padding:6px 0}
.note{font-size:12px;color:var(--muted);line-height:1.6}
.note .num{color:var(--text2)}
.err{color:var(--down);font-size:13px}
@media (prefers-reduced-motion:no-preference){.tile{transition:filter .15s}}

<script>
// ===== Core: universe, demo market generator, scan logic (no DOM) =====
// Universe format  SYMBOL:basePrice:relativeWeight   (official Nifty 200 list; weight = market cap in thousand crore)
const UNIVERSE_RAW = {

  "Metals": "APLAPOLLO:2188:61,ADANIENT:2745:372,HINDALCO:928:206,HINDCOPPER:432:42,HINDZINC:550:232,JSWSTEEL:1332:325,JINDALSTEL:1138:116,NMDC:69:61,NATIONALUM:321:59,SAIL:171:71,TATASTEEL:182:226,VAML:397:155,VEDL:255:100",
  "Banks": "AUBANK:993:74,AXISBANK:1369:426,BANKBARODA:275:142,BANKINDIA:159:73,MAHABANK:96:74,CANBK:134:122,FEDERALBNK:366:90,HDFCBANK:815:1258,ICICIBANK:1599:1148,IDFCFIRSTB:84:72,INDIANB:936:126,INDUSINDBK:931:73,KOTAKBANK:497:495,PNB:150:172,SBIN:1109:1023,UNIONBANK:208:159,YESBANK:18:56",
  "Power": "ADANIENSOL:1494:183,ADANIGREEN:1430:236,ADANIPOWER:208:401,JSWENERGY:515:94,NHPC:75:75,NLCINDIA:235:33,NTPC:322:312,POWERGRID:258:240,TATAPOWER:344:110",
  "Infra & Logistics": "ADANIPORTS:1917:442,CONCOR:442:34,GMRAIRPORT:104:111,INDIGO:5611:217,RVNL:196:41",
  "Oil, Gas, Coal": "ATGL:577:63,BPCL:306:133,COALINDIA:392:241,GAIL:187:123,HINDPETRO:390:83,IOC:146:206,ONGC:224:281,OIL:434:71,RELIANCE:1367:1850",
  "Cement": "AMBUJACEM:390:97,GRASIM:3055:207,ULTRACEMCO:12290:361",
  "Pharma & Health": "APOLLOHOSP:8712:125,AUROPHARMA:1794:103,BIOCON:359:59,CIPLA:1388:112,DIVISLAB:11150:296,DRREDDY:1388:116,FORTIS:807:61,GLENMARK:2616:74,LAURUSLABS:2338:126,LUPIN:1950:89,MANKIND:2610:108,MAXHEALTH:1031:100,SUNPHARMA:1870:449,TORNTPHARM:4669:178,ZYDUSLIFE:1204:120",
  "Auto": "ASHOKLEY:160:94,BAJAJ-AUTO:10770:296,BHARATFORG:1715:84,BOSCHLTD:49085:145,EICHERMOT:7828:215,EXIDEIND:380:32,HEROMOTOCO:5329:107,HYUNDAI:2121:172,MRF:128840:55,M&M:3399:408,MARUTI:12625:397,MOTHERSON:164:175,TVSMOTOR:4466:212,TMCV:446:164,TMPV:259:95,TIINDIA:2231:43",

  "Telecom": "BHARTIARTL:2138:1334,INDUSTOWER:393:104,TATACOMM:1802:51,IDEA:12:133",
  "FMCG": "BRITANNIA:4700:113,COLPAL:1720:47,DABUR:384:68,GODFRYPHLP:1788:28,GODREJCP:894:92,HINDUNILVR:2010:472,ITC:293:368,MARICO:924:120,NESTLEIND:1294:250,PATANJALI:405:44,RADICO:4663:62,TATACONSUM:1112:110,UNITDSPR:1444:103,VBL:430:145",
  "IT": "COFORGE:2041:90,HCLTECH:1356:367,INFY:1130:458,LTM:4118:122,MPHASIS:2445:47,OFSS:9741:85,PERSISTENT:5911:97,TCS:2407:871,TECHM:1762:173,WIPRO:190:188",
  "Realty": "DLF:766:190,GODREJPROP:1892:57,LODHA:1203:120,OBEROIRLTY:1820:66,PHOENIXLTD:2229:80,PRESTIGE:1692:73",
  "Chemicals": "PIIND:1672:25,SRF:2479:73,SOLARINDS:18764:170,UPL:552:47"
};

const DEFAULT_CFG = {
  maxMovePct: 5,      // skip stocks that already moved more than this at scan time
  minMovePct: 0,      // optional floor
  topSectors: 3,      // sectors picked per side
  n200TopK: 20,       // must be inside top-K gainers (buy) / losers (sell) of the universe
  wickMode: 'pct',    // 'pct' = wick >= wickPct of range AND longer wick; 'longer' = only the longer wick
  wickPct: 40,        // previous-day wick must be >= this % of the day's range (wickMode 'pct')
  firstCandle: true,
  theme: 'slate',     // slate | daylight | sand | ocean  // 09:15-09:20 candle must be green for buys, red for sells
  scanTime: '09:20',
  autoScan: true,
  weighting: 'cap',   // 'cap' or 'equal'
  mode: 'demo',       // 'demo' or 'live'
  endpoint: 'http://localhost:8787',
  pollSec: 5
};

const OPEN_MIN = 9 * 60 + 15;   // 09:15
const SESSION_MIN = 375;        // 09:15 -> 15:30

// ---------- helpers ----------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function randn(r) { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
const round2 = x => Math.round(x * 100) / 100;
function parseTime(s) { const m = /^(\d{1,2}):(\d{2})/.exec(s || ''); return m ? (+m[1]) * 60 + (+m[2]) : OPEN_MIN + 5; }
function fmtClock(mins) { const h = Math.floor(mins / 60), m = mins % 60; return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0'); }

// ---------- demo market ----------
function genDaily(r, prevClose) {
  const n = 40; let c = 100; const arr = [];
  for (let i = 0; i < n; i++) {
    const o = c * (1 + randn(r) * 0.003), cl = o * (1 + randn(r) * 0.014);
    const bh = Math.max(o, cl), bl = Math.min(o, cl);
    const pick = r(); let upM = 1, dnM = 1;
    if (i === n - 1) { if (pick < 0.25) { dnM = 4.5; upM = 0.5; } else if (pick < 0.5) { upM = 4.5; dnM = 0.5; } }
    else { if (pick < 0.15) dnM = 3.5; else if (pick < 0.3) upM = 3.5; }
    const h = bh * (1 + Math.abs(randn(r)) * 0.005 * upM), l = bl * (1 - Math.abs(randn(r)) * 0.005 * dnM);
    arr.push({ o, h, l, c: cl }); c = cl;
  }
  const k = prevClose / arr[n - 1].c;
  return arr.map(d => ({ o: round2(d.o * k), h: round2(d.h * k), l: round2(d.l * k), c: round2(d.c * k) }));
}

function genIntraday(r, prevClose, R) {
  const gap = (0.55 * R + randn(r) * 0.25) / 100, open = prevClose * (1 + gap);
  const T = Math.log(1 + R / 100) - Math.log(open / prevClose);
  const N = SESSION_MIN, w = []; let sw = 0;
  for (let i = 0; i < N; i++) { const x = Math.exp(-i / 25) + 0.2; w.push(x); sw += x; }
  const out = []; let px = open;
  for (let i = 0; i < N; i++) {
    const sigma = 0.00032 * (1 + 2.2 * Math.exp(-i / 20));
    const ret = T * w[i] / sw + randn(r) * sigma;
    const o = px, c = px * Math.exp(ret);
    const hi = Math.max(o, c) * (1 + Math.abs(randn(r)) * 0.00018), lo = Math.min(o, c) * (1 - Math.abs(randn(r)) * 0.00018);
    out.push({ o: round2(o), h: round2(hi), l: round2(lo), c: round2(c), v: Math.round(1000 + r() * 9000 * (1 + 2 * Math.exp(-i / 30))) });
    px = c;
  }
  return out;
}

function generateMarket(seed) {
  const rs = mulberry32(seed >>> 0), sectorR = {};
  for (const name of Object.keys(UNIVERSE_RAW)) sectorR[name] = randn(rs) * 1.2;
  const stocks = [];
  for (const [sector, str] of Object.entries(UNIVERSE_RAW)) {
    for (const item of str.split(',')) {
      const [symbol, p, w] = item.split(':'), base = +p, weight = +w;
      const r = mulberry32((seed ^ hashStr(symbol)) >>> 0);
      const hot = r() < 0.07 ? 3.2 : 1;
      const R = sectorR[sector] * 0.9 + randn(r) * 0.8 * hot;
      const prevClose = round2(base * (1 + randn(r) * 0.008));
      const daily = genDaily(r, prevClose), m1 = genIntraday(r, prevClose, R);
      const hiP = [-Infinity], loP = [Infinity];
      for (let i = 0; i < m1.length; i++) { hiP.push(Math.max(hiP[i], m1[i].h)); loP.push(Math.min(loP[i], m1[i].l)); }
      stocks.push({ symbol, sector, weight, prevClose, daily, m1, hiP, loP });
    }
  }
  return { seed, stocks };
}

function quoteAt(s, m) {
  m = Math.max(1, Math.min(SESSION_MIN, m));
  const c = s.m1[m - 1].c;
  return { symbol: s.symbol, sector: s.sector, weight: s.weight, ltp: c, prevClose: s.prevClose, open: s.m1[0].o, high: s.hiP[m], low: s.loP[m], chg: (c / s.prevClose - 1) * 100, prevDay: s.daily[s.daily.length - 1], sectors: [s.sector], first5: m >= 5 ? { o: s.m1[0].o, h: Math.max(...s.m1.slice(0, 5).map(x => x.h)), l: Math.min(...s.m1.slice(0, 5).map(x => x.l)), c: s.m1[4].c } : null };
}

function aggregate(m1, m, step) {
  step = step || 5; const out = [];
  for (let i = 0; i < m; i += step) {
    const sl = m1.slice(i, Math.min(i + step, m));
    out.push({ i: i / step, o: sl[0].o, h: Math.max(...sl.map(x => x.h)), l: Math.min(...sl.map(x => x.l)), c: sl[sl.length - 1].c, v: sl.reduce((a, b) => a + (b.v || 0), 0) });
  }
  return out;
}

// ---------- scan logic ----------
function sectorStats(quotes, cfg, defs) {
  if (defs && defs.length) {
    const qm = new Map(quotes.map(q => [q.symbol, q]));
    return defs.map(d => {
      const ms = d.members.map(x => qm.get(x)).filter(Boolean);
      let sw = 0, sx = 0, sum = 0; ms.forEach(q => { const w = q.weight || 1; sw += w; sx += q.chg * w; sum += q.chg; });
      const calc = ms.length ? (cfg.weighting === 'equal' ? sum / ms.length : sx / sw) : null;
      return { name: d.name, avg: d.chg != null ? d.chg : calc, value: d.value, custom: d.custom, count: ms.length, constituents: d.constituents, weight: sw || 1,
        adv: ms.filter(q => q.chg > 0).length, dec: ms.filter(q => q.chg < 0).length };
    }).filter(x => x.avg != null).sort((a, b) => b.avg - a.avg);
  }
  const g = new Map();
  for (const q of quotes) { if (!g.has(q.sector)) g.set(q.sector, { name: q.sector, sw: 0, s: 0, n: 0, sum: 0, weight: 0 }); const o = g.get(q.sector); const w = q.weight || 1; o.sw += w; o.s += q.chg * w; o.sum += q.chg; o.n++; o.weight += w; }
  const arr = [...g.values()].map(o => ({ name: o.name, avg: cfg.weighting === 'equal' ? o.sum / o.n : o.s / o.sw, count: o.n, weight: o.weight }));
  return arr.sort((a, b) => b.avg - a.avg);
}

function wickInfo(pd) {
  const range = pd.h - pd.l;
  if (!(range > 0)) return { lowerPct: 0, upperPct: 0, bodyPct: 0 };
  const bodyHi = Math.max(pd.o, pd.c), bodyLo = Math.min(pd.o, pd.c);

  // ---------- charts ----------
  const col = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function drawCandles(cv, c, o) {
    const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight; if (!W) return;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    const C = { up: col('--up'), down: col('--down'), line: col('--line'), muted: col('--muted'), accent: col('--accent'), bg: col('--bg') };
    const padL = 6, padR = 62, padT = 8, padB = 20, pw = W - padL - padR, ph = H - padT - padB;
    if (!c.length) { g.fillStyle = C.muted; g.font = '13px sans-serif'; g.fillText('No candles yet', 12, 24); cv._info = null; return; }
    let lo = Infinity, hi = -Infinity; c.forEach(d => { lo = Math.min(lo, d.l); hi = Math.max(hi, d.h); });
    const ext = Math.max((hi - lo) * 0.6, last0(c) * 0.004);
    const inr = l => l.y > 0 && l.y >= lo - ext && l.y <= hi + ext;
    (o.lines || []).forEach(l => { if (inr(l)) { lo = Math.min(lo, l.y); hi = Math.max(hi, l.y); } });
    const pv = (hi - lo) * 0.06 || 1; lo -= pv; hi += pv;
    const Y = v => padT + (hi - v) / (hi - lo) * ph, slots = o.slots || c.length, step = pw / slots, bw = Math.max(1.5, Math.min(step * 0.72, 14));
    g.font = '11px "JetBrains Mono",monospace'; g.lineWidth = 1;
    g.textAlign = 'left'; g.textBaseline = 'middle';
    for (let i = 0; i <= 4; i++) { const v = lo + (hi - lo) * i / 4, y = Math.round(Y(v)) + .5; g.strokeStyle = C.line; g.beginPath(); g.moveTo(padL, y); g.lineTo(W - padR, y); g.stroke(); g.fillStyle = C.muted; g.fillText(fmtPx(v), W - padR + 5, y); }
    g.textAlign = 'center'; g.textBaseline = 'top'; g.fillStyle = C.muted;
    (o.xlabels || []).forEach(a => { const first = a[0] === 0; g.textAlign = first ? 'left' : 'center'; g.fillText(a[1], first ? padL : padL + step * (a[0] + .5), H - padB + 5); });
    if (o.hiIndex != null) { g.fillStyle = col('--accent-soft'); g.fillRect(padL + step * o.hiIndex, padT, step, ph); }
    let pinTop = 0, pinBot = 0;
    (o.lines || []).forEach(l => {
      if (!(l.y > 0)) return; g.fillStyle = l.color; g.textAlign = 'left';
      if (!inr(l)) { const below = l.y < lo, yy = below ? padT + ph - 8 - 14 * pinBot++ : padT + 9 + 14 * pinTop++; g.textBaseline = 'middle'; g.fillText((below ? '▼ ' : '▲ ') + l.label + ' ' + fmtPx(l.y), padL + 3, yy); return; }
      const y = Math.round(Y(l.y)) + .5;
      g.strokeStyle = l.color; g.setLineDash(l.dash || [4, 4]); g.beginPath(); g.moveTo(padL, y); g.lineTo(W - padR, y); g.stroke(); g.setLineDash([]);
      g.textBaseline = 'bottom'; g.fillText(l.label, padL + 3, y - 2);
    });
    if (o.vIndex != null) { const x = Math.round(padL + step * o.vIndex) + .5; g.strokeStyle = C.accent; g.setLineDash([2, 3]); g.beginPath(); g.moveTo(x, padT); g.lineTo(x, padT + ph); g.stroke(); g.setLineDash([]); g.fillStyle = C.accent; g.textAlign = 'left'; g.textBaseline = 'top'; g.fillText(o.vLabel || '', x + 4, padT + 2); }
    c.forEach((d, i) => {
      const x = padL + step * (i + .5), colr = d.c >= d.o ? C.up : C.down; g.strokeStyle = colr; g.fillStyle = colr;
      g.beginPath(); g.moveTo(Math.round(x) + .5, Y(d.h)); g.lineTo(Math.round(x) + .5, Y(d.l)); g.stroke();
      const yt = Y(Math.max(d.o, d.c)), yb = Y(Math.min(d.o, d.c)); g.fillRect(x - bw / 2, yt, bw, Math.max(1, yb - yt));
    });
    const last = c[c.length - 1], ly = Y(last.c);
    g.fillStyle = C.accent; g.fillRect(W - padR + 1, ly - 8, padR - 2, 16);
    g.fillStyle = col('--accent-ink'); g.textAlign = 'left'; g.textBaseline = 'middle'; g.fillText(fmtPx(last.c), W - padR + 4, ly);
    cv._info = { c, padL, step, o };
  }

  const last0 = c => c[c.length - 1].c;

  function bindReadout(cv, ro) {
    const show = e => {
      const inf = cv._info; if (!inf) return;
      const r = cv.getBoundingClientRect(), i = Math.floor((e.clientX - r.left - inf.padL) / inf.step), d = inf.c[i];
      ro.textContent = d ? (inf.o.labelOf ? inf.o.labelOf(i) + '  ' : '') + 'O ' + fmtPx(d.o) + '  H ' + fmtPx(d.h) + '  L ' + fmtPx(d.l) + '  C ' + fmtPx(d.c) : '';
    };
    cv.addEventListener('pointermove', show); cv.addEventListener('pointerdown', show);
  }

  function tradingDates(n) {
    const out = [], d = new Date(); d.setHours(12);
    while (out.length < n) { d.setDate(d.getDate() - 1); const w = d.getDay(); if (w !== 0 && w !== 6) out.push(new Date(d)); }
    return out.reverse();
  }
  const dFmt = d => d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });

  async function getCandles(sym, tf) {
    if (isDemo()) {
      const st = S.bymap.get(sym); if (!st) return [];
      return tf === '5m' ? aggregate(st.m1, S.simMin, 5) : st.daily.slice(-30);
    }
    const k = sym + '|' + tf + '|' + (S.date || ''), hit = S.cc[k], ttl = tf === '5m' ? Math.max(3, S.cfg.pollSec) * 1000 : 600000;
    if (hit && Date.now() - hit.t < ttl) return hit.d;
    const r = await fetch(S.endpointBase() + '/candles?symbol=' + encodeURIComponent(sym) + '&tf=' + tf + dq('&'), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json(); S.cc[k] = { t: Date.now(), d }; return d;
  }

  async function renderChart() {
    if (!S.quotes.length) { morph($('#main'), waitingHtml()); S.chartBuilt = false; return; }
    if (!S.chartBuilt) buildChartShell();
    const sym = S.sym, q = S.qmap.get(sym); if (!q) { morph($('#chHead'), '<div class="empty">' + ico('search') + '<b>Pick a symbol from the list above.</b></div>'); return; }
    const sc = S.scan, tag = sc && sc.buy.passed.some(x => x.q.symbol === sym) ? '<span class="chip ok">Shortlisted: buy</span>' : sc && sc.sell.passed.some(x => x.q.symbol === sym) ? '<span class="chip bad">Shortlisted: sell</span>' : '<span class="chip no">Not shortlisted</span>';
    const w = wickInfo(q.prevDay);
    const stat = (k, v, extra) => '<div class="stat"><span>' + k + '</span><b>' + v + '</b>' + (extra || '') + '</div>';
    morph($('#chHead'), '<section class="qhead"><div class="qt"><div><div class="qsym">' + esc(sym) + '</div><div class="sec">' + esc((q.sectors || [q.sector]).join(' · ')) + '</div></div>' + tag + '</div><div class="stats">' +
      stat('LTP', '<span class="' + cls(q.chg) + '">' + fmtPx(q.ltp) + '</span>', '<em class="' + cls(q.chg) + '">' + fmtPct(q.chg) + '</em>') + stat('Open', fmtPx(q.open)) + stat('High', fmtPx(q.high)) + stat('Low', fmtPx(q.low)) +
      stat('Prev-day wick', '↓' + w.lowerPct.toFixed(0) + '% · ↑' + w.upperPct.toFixed(0) + '%', '<em class="muted">lower · upper</em>') + '</div></section>');

    morph($('#quick'), sc ? ((sc.buy.passed.length ? '<span class="pl">Buy</span>' + quick(sc.buy.passed, 'ok') : '') + (sc.sell.passed.length ? '<span class="pl">Sell</span>' + quick(sc.sell.passed, 'bad') : '')) : '');
    try {
      const [intr, daily] = await Promise.all([getCandles(sym, '5m'), getCandles(sym, '1d')]);
      if (sym !== S.sym || S.tab !== 'chart') return;
      const pd = q.prevDay, sm = scanMin();
      const slots = Math.max(24, Math.min(75, intr.length + 6)), every = slots > 40 ? 12 : 6;
      const xl = []; for (let i = 0; i < slots; i += every) xl.push([i, fmtClock(OPEN_MIN + i * 5)]);
      drawCandles($('#cv5'), intr, { slots, xlabels: xl, labelOf: i => fmtClock(OPEN_MIN + i * 5), vIndex: sm / 5, vLabel: S.cfg.scanTime + ' scan', hiIndex: null, lines: [
        { y: q.prevClose, label: 'Prev close', color: col('--muted'), dash: [5, 4] }, { y: pd.h, label: 'Prev day high', color: col('--accent'), dash: [1, 4] }, { y: pd.l, label: 'Prev day low', color: col('--accent'), dash: [1, 4] }] });
      $('#t5').textContent = '5-min · ' + (S.date ? fmtDay(S.date) : 'today');
      $('#ic').textContent = intr.length ? intr.length + ' candles · ' + fmtClock(OPEN_MIN + Math.min(nowMin(), SESSION_MIN)) : '';
      let dates = isDemo() ? tradingDates(daily.length) : daily.map(d => new Date(d.t));
      const dl = []; for (let i = 0; i < daily.length; i += 6) dl.push([i, dFmt(dates[i])]);

  }

    $('#sessionLbl').textContent = S.dateMsg ? S.dateMsg : !isDemo() && S.session && S.session !== todayIST() ? 'Session ' + new Date(S.session + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : isDemo() ? 'Demo clock' : 'IST';
    morph($('#viewSeg'), '<button data-view="live" aria-pressed="' + !viewLock() + '">Live</button><button data-view="lock" aria-pressed="' + viewLock() + '"' +
      (S.locked && S.snap ? '' : ' disabled title="Available once the market reaches ' + esc(S.cfg.scanTime) + '"') + '>@ ' + esc(S.cfg.scanTime) + '</button>');
    const sc = S.scan, sb = $('#shortCount'); sb.textContent = sc ? sc.buy.passed.length + sc.sell.passed.length : ''; sb.hidden = !sc;
    if (S.tab === 'set') { renderSettings(); return; }
    ({ heat: renderHeat, short: renderShort, chart: renderChart })[S.tab]();
  }

  function setTab(t) {
    S.tab = t; S.chartBuilt = false;
    document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
    $('#main').scrollTop = 0;
    render(true);
  }

  // ---------- events ----------
  document.addEventListener('click', e => {
    const tab = e.target.closest('nav.tabs button'); if (tab) { setTab(tab.dataset.tab); return; }
    const vw = e.target.closest('[data-view]'); if (vw) { S.view = vw.dataset.view; update(); render(true); return; }
    const side = e.target.closest('[data-side]'); if (side) { S.side = side.dataset.side; render(); return; }
    const sec = e.target.closest('[data-sector]');
    if (sec) { S.sector = sec.dataset.sector; if (S.tab !== 'heat') setTab('heat'); else render(); return; }
    const sym = e.target.closest('[data-sym]');
    if (sym) { S.sym = sym.dataset.sym; if (S.tab !== 'chart') setTab('chart'); else { $('#symIn').value = S.sym; render(); } return; }
    const act = e.target.closest('[data-act]'); if (!act) return;
    const a = act.dataset.act;
    if (a === 'allsec') { S.sector = null; render(); }
    else if (a === 'latest') setDate(null);
    else if (a === 'prev' || a === 'next') { const syms = S.quotes.map(q => q.symbol).sort(), i = syms.indexOf(S.sym), n = syms.length; if (n) { S.sym = syms[(i + (a === 'next' ? 1 : -1) + n) % n]; $('#symIn').value = S.sym; render(); } }
    else if (a === 'reset') { S.cfg = defaults(); saveCfg(); restartLoops(); }
  });
  document.addEventListener('toggle', e => { if (e.target.id === 'nearD') S.nearOpen = e.target.open; }, true);
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'dateIn') {
      const want = t.value, dates = S.sessions ? S.sessions.dates : [];
      if (!want) { setDate(null); return; }
      let pick = want;
      if (dates.length && !dates.includes(want)) {
        pick = dates.find(x => x < want) || dates[dates.length - 1];
        S.dateMsg = 'No trading on ' + new Date(want + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ', showing ' + new Date(pick + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
        clearTimeout(S.dateMsgT); S.dateMsgT = setTimeout(() => { S.dateMsg = null; render(); }, 5000);
      }
      t.value = pick; t.blur(); setDate(pick); return;
    }
    if (t.id === 'symIn') { const v = t.value.trim().toUpperCase(); if (S.qmap.has(v)) { S.sym = v; render(); } return; }
    const k = t.dataset.k; if (!k) return;
    let v = t.type === 'checkbox' ? t.checked : t.type === 'number' ? parseFloat(t.value) : t.value;
    if (t.type === 'number' && !isFinite(v)) return;
    S.cfg[k] = v; saveCfg(); applyCfgChange([k]);
  });

  // One place that reacts to settings, whether they changed here or in another window of the app.
  function applyCfgChange(keys) {
    const has = k => keys.includes(k);
    if (has('theme')) applyTheme();
    if (has('mode') || has('endpoint') || has('pollSec')) { restartLoops(); return; }
    if (has('scanTime') || has('autoScan')) clearLock();          // the old snapshot belongs to the old scan time
    update(); render(true);
  }
  window.addEventListener('storage', e => {
    if (e.key !== KEY) return;
    const old = S.cfg; S.cfg = loadCfg();
    const changed = Object.keys(S.cfg).filter(k => S.cfg[k] !== old[k]);
    if (changed.length) applyCfgChange(changed);
  });
  $('#playBtn').addEventListener('click', () => { S.playing = !S.playing; $('#playBtn').textContent = S.playing ? 'Pause' : 'Play'; });
  $('#replayBtn').addEventListener('click', () => { S.simMin = 1; S.locked = false; S.snap = null; S.playing = true; $('#playBtn').textContent = 'Pause'; $('#slider').value = 1; update(); render(); });
  $('#newDayBtn').addEventListener('click', () => { newMarket(Math.floor(Math.random() * 1e6)); S.simMin = 5; S.locked = false; S.snap = null; S.sym = null; update(); render(); });
  $('#slider').addEventListener('input', e => { S.simMin = +e.target.value; update(); render(); });
  $('#speedSel').addEventListener('change', restartLoops);
  let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { S.chartBuilt = S.tab === 'chart' ? S.chartBuilt : false; render(); }, 150); });

  // ---------- start ----------
  applyTheme();
  newMarket(7);
  restartLoops();
})();

</script>
</body>
</html>
